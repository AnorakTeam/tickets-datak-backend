services:
  db:
    image: postgres:16-alpine
    container_name: tickets_datak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets_datak
      POSTGRES_USER: datak
      POSTGRES_PASSWORD: datak_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datak -d tickets_datak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
